name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * 0'   # 每周日 00:00 执行（UTC 时间）
  workflow_dispatch:         # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork via GitHub API
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/merge-upstream \
            -f branch=master
